<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Search Gallery</title>
</head>

<body>
  <main class="container">
    <form class="form" id="search-form" autocomplete="off">
      <input type="text" name="search-text" class="search-input" placeholder="Search images..." required />
      <button type="submit" class="search-btn">Search</button>
    </form>

    <ul class="gallery"></ul>

    <div class="loader-container is-hidden" id="loader">
      <span class="css-loader"></span>
    </div>
  </main>

  <script type="module" src="./main.js"></script>
</body>

</html>
